# https://taskfile.dev
version: '3'

tasks:
    # ── Testing ───────────────────────────────────────────────────
    test:php:
        desc: Run PHPUnit tests for Chat module
        cmd: php artisan test --testsuite=Modules --filter='^Modules\\Chat\\Tests'

    test:e2e:
        desc: Run E2E tests for Chat module
        cmd: npx playwright test --project="@Chat*" {{.CLI_ARGS}}
        interactive: true

    # ── Code Generation ────────────────────────────────────────────

    types:generate:
        desc: Generate TypeScript types from PHP DTOs and enums
        cmd: '{{.APP}} php artisan module:generate-types chat'
