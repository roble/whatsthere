<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Whatsthere symbol</title>
  <desc id="desc">A white wayfinding mark with a centered compass needle cut out of it.</desc>

  <!-- One path, two subpaths, evenodd: the needle is a hole rather than a
       second shape painted on top, so the mark keeps working on any
       background. -->
  <path
    fill="#FFFFFF"
    fill-rule="evenodd"
    d="
      M 210 48
      C 119 57, 48 128, 48 210
      L 48 302
      C 48 392, 120 464, 210 464
      L 302 464
      C 392 464, 464 392, 464 302
      L 464 210
      C 464 128, 393 57, 302 48
      Z
      M 374.7 137.3
      l -50.5 151.5
      a 56.0 56.0 0 0 1 -35.4 35.4
      L 137.3 374.7
      l 50.5 -151.5
      a 56.0 56.0 0 0 1 35.4 -35.4
      Z
    "
  />
</svg>
